apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bifrost-budget.fullname" . }}
  labels:
    {{- include "bifrost-budget.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bifrost-budget.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "bifrost-budget.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bifrost-budget
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: BIFROST_TRANSPORT
              value: {{ .Values.env.transport | quote }}
            - name: BIFROST_MCP_PATH
              value: {{ .Values.env.mcpPath | quote }}
            - name: BIFROST_TIMEOUT_SECONDS
              value: {{ .Values.env.timeoutSeconds | quote }}
            - name: BIFROST_API_BASE_URL
              value: {{ required "env.apiBaseUrl is required" .Values.env.apiBaseUrl | quote }}
            {{- if .Values.env.virtualKey.value }}
            - name: BIFROST_VIRTUAL_KEY
              value: {{ .Values.env.virtualKey.value | quote }}
            {{- else if .Values.env.virtualKey.existingSecret }}
            - name: BIFROST_VIRTUAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.virtualKey.existingSecret | quote }}
                  key: {{ .Values.env.virtualKey.existingSecretKey | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
