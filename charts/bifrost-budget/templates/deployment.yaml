apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bifrost-budget.fullname" . }}
  labels:
    {{- include "bifrost-budget.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bifrost-budget.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "bifrost-budget.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bifrost-budget
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: BIFROST_TRANSPORT
              value: {{ .Values.env.transport | quote }}
            - name: BIFROST_MCP_PATH
              value: {{ .Values.env.mcpPath | quote }}
            - name: BIFROST_TIMEOUT_SECONDS
              value: {{ .Values.env.timeoutSeconds | quote }}
            - name: BIFROST_API_BASE_URL
              value: {{ required "env.apiBaseUrl is required" .Values.env.apiBaseUrl | quote }}
            - name: BIFROST_AUTH_PROVIDER
              value: {{ .Values.env.authProvider | quote }}
            - name: BIFROST_ENTRA_TENANT_ID
              value: {{ .Values.env.entraTenantId | quote }}
            - name: BIFROST_ENTRA_AUDIENCE
              value: {{ .Values.env.entraAudience | quote }}
            - name: BIFROST_ENTRA_SCOPE
              value: {{ .Values.env.entraScope | quote }}
            - name: BIFROST_ENTRA_ISSUER
              value: {{ .Values.env.entraIssuer | quote }}
            - name: BIFROST_ENTRA_DISCOVERY_URL
              value: {{ .Values.env.entraDiscoveryUrl | quote }}
            - name: BIFROST_ENTRA_JWKS_URL
              value: {{ .Values.env.entraJwksUrl | quote }}
            - name: BIFROST_ENTRA_USER_MAP
              value: {{ .Values.env.entraUserMap | quote }}
            - name: BIFROST_PING_ISSUER
              value: {{ .Values.env.pingIssuer | quote }}
            - name: BIFROST_PING_AUDIENCE
              value: {{ .Values.env.pingAudience | quote }}
            - name: BIFROST_PING_DISCOVERY_URL
              value: {{ .Values.env.pingDiscoveryUrl | quote }}
            - name: BIFROST_PING_JWKS_URL
              value: {{ .Values.env.pingJwksUrl | quote }}
            - name: BIFROST_PING_SCOPE
              value: {{ .Values.env.pingScope | quote }}
            - name: BIFROST_PING_DELEGATED_CLAIM
              value: {{ .Values.env.pingDelegatedClaim | quote }}
            - name: BIFROST_PING_DELEGATED_VALUE
              value: {{ .Values.env.pingDelegatedValue | quote }}
            {{- if .Values.env.userinfoUrl }}
            - name: BIFROST_USERINFO_URL
              value: {{ .Values.env.userinfoUrl | quote }}
            {{- end }}
            {{- if .Values.env.adminApiKey.existingSecret }}
            - name: BIFROST_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.adminApiKey.existingSecret | quote }}
                  key: {{ .Values.env.adminApiKey.existingSecretKey | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
