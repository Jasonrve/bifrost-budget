replicaCount: 2

image:
  repository: ghcr.io/jasonrve/bifrost-budget
  # Pin releases by default; override explicitly for a CI SHA or another release.
  tag: "0.3.8"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: bifrost-budget.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  apiBaseUrl: https://bifrost.example.com
  userinfoUrl: https://sso-dev.sanlamcloud.co.za/as/userinfo
  transport: streamable-http
  mcpPath: /mcp
  timeoutSeconds: 15
  virtualKey:
    value: ""
    existingSecret: ""
    existingSecretKey: BIFROST_VIRTUAL_KEY
  adminApiKey:
    existingSecret: ""
    existingSecretKey: BIFROST_ADMIN_API_KEY

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
