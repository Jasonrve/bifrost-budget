replicaCount: 2

image:
  repository: ghcr.io/jasonrve/bifrost-budget
  # Pin releases by default; override explicitly for a CI SHA or another release.
  tag: "0.5.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: bifrost-budget.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  apiBaseUrl: https://bifrost.example.com
  authProvider: entra
  entraTenantId: ""
  entraAudience: ""
  entraScope: Quota.Read
  entraIssuer: ""
  entraDiscoveryUrl: ""
  entraJwksUrl: ""
  # JSON object mapping <tenant-guid>:<user-guid> to exact Bifrost user IDs.
  entraUserMap: "{}"
  pingIssuer: ""
  pingAudience: ""
  pingDiscoveryUrl: ""
  pingJwksUrl: ""
  pingScope: ""
  userinfoUrl: ""
  transport: streamable-http
  mcpPath: /mcp
  timeoutSeconds: 15
  adminApiKey:
    existingSecret: ""
    existingSecretKey: BIFROST_ADMIN_API_KEY

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
