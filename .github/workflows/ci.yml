name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv pip install --system -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Helm lint
        uses: azure/setup-helm@v4
      - run: helm lint charts/bifrost-budget

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read package version
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          import re

          with open("pyproject.toml", "rb") as pyproject:
              version = tomllib.load(pyproject)["project"]["version"]
          if not re.fullmatch(r"0\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"not a supported semantic release version: {version}")
          print(version)
          PY
          )
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing release image tag
        if: github.ref == 'refs/heads/main'
        run: |
          # Commit SHA and latest are intentionally mutable/rolling tags. The
          # semantic version tag is a release pointer and must never move.
          # Check immediately before the push so chart-only changes cannot
          # silently republish an existing release. A concurrent publisher may
          # still win the race; registry immutability policy must reject it.
          if docker manifest inspect "ghcr.io/jasonrve/bifrost-budget:${VERSION}" >/dev/null 2>&1; then
            echo "Refusing to publish existing release tag ${VERSION}" >&2
            exit 1
          fi
          echo "Release tag ${VERSION} is not present; SHA/latest remain explicit rolling tags."
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/jasonrve/bifrost-budget:${{ github.sha }}
            ghcr.io/jasonrve/bifrost-budget:latest
            ghcr.io/jasonrve/bifrost-budget:${{ env.VERSION }}
