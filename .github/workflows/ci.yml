name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish immutable release and rolling GHCR tags
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv pip install --system -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Helm lint
        uses: azure/setup-helm@v4
      - run: helm lint charts/bifrost-budget

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read package version
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          import re

          with open("pyproject.toml", "rb") as pyproject:
              version = tomllib.load(pyproject)["project"]["version"]
          if not re.fullmatch(r"0\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"not a supported semantic release version: {version}")
          print(version)
          PY
          )
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Validate release dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Release publishing must be dispatched from main." >&2
            exit 1
          fi
      - name: Build image (no publish)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_SHA=${{ github.sha }}

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    # Serialize publishers so a second dispatch observes the first release tag.
    concurrency:
      group: bifrost-budget-ghcr-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read package version
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          import re

          with open("pyproject.toml", "rb") as pyproject:
              version = tomllib.load(pyproject)["project"]["version"]
          if not re.fullmatch(r"0\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"not a supported semantic release version: {version}")
          print(version)
          PY
          )
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing release image tag
        run: |
          # Commit SHA and latest are intentionally mutable/rolling tags. The
          # semantic version tag is a release pointer and must never move.
          # Check immediately before the push; registry immutability policy
          # rejects any concurrent publisher that wins the race.
          if docker manifest inspect "ghcr.io/jasonrve/bifrost-budget:${VERSION}" >/dev/null 2>&1; then
            echo "Refusing to publish existing release tag ${VERSION}" >&2
            exit 1
          fi
          echo "Release tag ${VERSION} is not present; SHA/latest remain explicit rolling tags."
      - name: Build and publish release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/jasonrve/bifrost-budget:${{ github.sha }}
            ghcr.io/jasonrve/bifrost-budget:latest
            ghcr.io/jasonrve/bifrost-budget:${{ env.VERSION }}
